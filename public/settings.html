<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings · T-Video Media</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    .settings-section { margin-bottom: 24px; }
    .settings-section .card { padding: 24px; }
    .section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }
    .section-header .icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .section-header .icon.blue { background: rgba(0, 224, 255, 0.12); }
    .section-header .icon.amber { background: rgba(245, 158, 11, 0.12); }
    .section-header .icon.green { background: rgba(34, 197, 94, 0.12); }
    .section-header .icon.red { background: rgba(239, 68, 68, 0.12); }
    .section-header .icon.purple { background: rgba(168, 85, 247, 0.12); }
    .section-header h3 { margin: 0; font-size: 1.1rem; }
    .section-header p { margin: 4px 0 0; font-size: 0.85rem; color: var(--text-muted); }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }

    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
    .field .input { width: 100%; }

    /* Toggle switch */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }
    .toggle-row:last-child { border-bottom: none; }
    .toggle-row .toggle-label { font-size: 0.95rem; }
    .toggle-row .toggle-desc { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-switch .slider {
      position: absolute;
      inset: 0;
      background: var(--line);
      border-radius: 24px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle-switch .slider::before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      bottom: 3px;
      background: var(--text);
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle-switch input:checked + .slider { background: var(--primary); }
    .toggle-switch input:checked + .slider::before { transform: translateX(20px); }

    .logout-section {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.08), rgba(239, 68, 68, 0.02));
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
    .btn-logout {
      background: var(--danger);
      color: #fff;
      font-weight: 600;
      padding: 12px 32px;
      font-size: 1rem;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-logout:hover { opacity: 0.85; }

    .status-msg {
      display: inline-block;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      margin-top: 8px;
    }
    .status-msg.success { background: rgba(34, 197, 94, 0.12); color: var(--success); }
    .status-msg.error { background: rgba(239, 68, 68, 0.12); color: var(--danger); }
  </style>
</head>
<body>
  <div id="appRoot"></div>

  <template id="pageContent">
    <h1 class="page-title">Settings</h1>

    <!-- Profile Section -->
    <div class="settings-section">
      <div class="card">
        <div class="section-header">
          <div class="icon blue">👤</div>
          <div>
            <h3>Profile Information</h3>
            <p>Update your account details</p>
          </div>
        </div>
        <form id="profileForm" autocomplete="off" novalidate>
          <div class="form-grid">
            <div class="field">
              <label for="s_username">Username</label>
              <input class="input" id="s_username" placeholder="Your username" />
            </div>
            <div class="field">
              <label for="s_email">Email or phone</label>
              <input class="input" id="s_email" placeholder="Your email" />
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Save Changes</button>
          <span id="profileStatus"></span>
        </form>
      </div>
    </div>

    <!-- Security Section -->
    <div class="settings-section">
      <div class="card">
        <div class="section-header">
          <div class="icon amber">🔒</div>
          <div>
            <h3>Security</h3>
            <p>Change your password to keep your account secure</p>
          </div>
        </div>
        <form id="pwForm" autocomplete="off" novalidate>
          <div class="field">
            <label for="pw_current">Current Password</label>
            <input class="input" id="pw_current" type="password" placeholder="Enter current password" required />
          </div>
          <div class="form-grid">
            <div class="field">
              <label for="pw_new">New Password</label>
              <input class="input" id="pw_new" type="password" placeholder="Enter new password" required />
            </div>
            <div class="field">
              <label for="pw_confirm">Confirm New Password</label>
              <input class="input" id="pw_confirm" type="password" placeholder="Re-enter new password" required />
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Update Password</button>
          <span id="pwStatus"></span>
        </form>
      </div>
    </div>

    <!-- Preferences Section -->
    <div class="settings-section">
      <div class="card">
        <div class="section-header">
          <div class="icon purple">🎨</div>
          <div>
            <h3>Preferences</h3>
            <p>Customize your experience</p>
          </div>
        </div>
        <div class="form-grid">
          <div class="field">
            <label for="s_lang">Language</label>
            <select id="s_lang">
              <option>English</option>
              <option>Spanish</option>
              <option>French</option>
              <option>German</option>
              <option>Portuguese</option>
              <option>Hindi</option>
              <option>Indonesian</option>
            </select>
          </div>
          <div class="field">
            <label for="s_theme">Theme</label>
            <select id="s_theme">
              <option value="dark">Dark (default)</option>
              <option value="darker">Deep dark</option>
            </select>
          </div>
        </div>
        <button class="btn btn-primary" id="prefBtn">Apply Preferences</button>
      </div>
    </div>

    <!-- Notifications Section -->
    <div class="settings-section">
      <div class="card">
        <div class="section-header">
          <div class="icon green">🔔</div>
          <div>
            <h3>Notifications</h3>
            <p>Manage what alerts you receive</p>
          </div>
        </div>
        <div class="toggle-row">
          <div>
            <div class="toggle-label">Task Reminders</div>
            <div class="toggle-desc">Get notified when daily tasks are available</div>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" checked />
            <span class="slider"></span>
          </label>
        </div>
        <div class="toggle-row">
          <div>
            <div class="toggle-label">VIP Upgrade Promotions</div>
            <div class="toggle-desc">Receive special package offers</div>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" checked />
            <span class="slider"></span>
          </label>
        </div>
        <div class="toggle-row">
          <div>
            <div class="toggle-label">Withdrawal Updates</div>
            <div class="toggle-desc">Status changes on your withdrawal requests</div>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" checked />
            <span class="slider"></span>
          </label>
        </div>
        <div class="toggle-row">
          <div>
            <div class="toggle-label">Referral Activity</div>
            <div class="toggle-desc">When someone uses your invite code</div>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" />
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

    <!-- Data Management Section -->
    <div class="settings-section">
      <div class="card">
        <div class="section-header">
          <div class="icon amber">🗄️</div>
          <div>
            <h3>Data Management</h3>
            <p>Reset your account data back to initial state</p>
          </div>
        </div>
        <p style="font-size:0.9rem;color:var(--text-muted);margin-bottom:16px;">
          This will reset your balance, completed tasks, and withdrawal history.
          Your account credentials will remain unchanged.
        </p>
        <button class="btn btn-warning" id="resetBtn">Reset Account Data</button>
      </div>
    </div>

    <!-- Logout Section -->
    <div class="settings-section">
      <div class="card logout-section">
        <div class="section-header" style="border-bottom:none;margin-bottom:8px;padding-bottom:0;">
          <div class="icon red">🚪</div>
          <div>
            <h3>Sign Out</h3>
            <p>End your current session</p>
          </div>
        </div>
        <p style="font-size:0.9rem;color:var(--text-muted);margin-bottom:16px;">
          You will be redirected to the login page. You can sign back in at any time.
        </p>
        <button class="btn-logout" id="logoutBtn">Logout</button>
      </div>
    </div>
  </template>

  <script>if (!localStorage.getItem('tvmd_token')) { location.href = 'login.html'; }</script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    UI.renderShell("Settings");

    // Populate profile fields
    document.getElementById("s_username").value = DEMO.user.username || '';
    document.getElementById("s_email").value = DEMO.user.email || '';

    // Profile form
    document.getElementById("profileForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var statusEl = document.getElementById("profileStatus");
      DEMO.api.setProfile({
        username: document.getElementById("s_username").value,
        email: document.getElementById("s_email").value,
      });
      statusEl.className = 'status-msg success';
      statusEl.textContent = 'Profile saved successfully';
      setTimeout(function () { statusEl.textContent = ''; }, 3000);
    });

    // Password form - calls real API
    document.getElementById("pwForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var statusEl = document.getElementById("pwStatus");
      var currentPassword = document.getElementById("pw_current").value;
      var newPassword = document.getElementById("pw_new").value;
      var confirmPassword = document.getElementById("pw_confirm").value;

      if (!currentPassword || !newPassword) {
        statusEl.className = 'status-msg error';
        statusEl.textContent = 'All fields are required';
        return;
      }
      if (newPassword !== confirmPassword) {
        statusEl.className = 'status-msg error';
        statusEl.textContent = 'New passwords do not match';
        return;
      }
      if (newPassword.length < 6) {
        statusEl.className = 'status-msg error';
        statusEl.textContent = 'Password must be at least 6 characters';
        return;
      }

      statusEl.className = 'status-msg';
      statusEl.textContent = 'Updating...';

      API.fetch('/api/settings/password', {
        method: 'PUT',
        body: JSON.stringify({ currentPassword: currentPassword, newPassword: newPassword })
      }).then(function (data) {
        if (data.error) {
          statusEl.className = 'status-msg error';
          statusEl.textContent = data.error;
        } else {
          statusEl.className = 'status-msg success';
          statusEl.textContent = 'Password updated successfully';
          document.getElementById("pw_current").value = '';
          document.getElementById("pw_new").value = '';
          document.getElementById("pw_confirm").value = '';
        }
        setTimeout(function () { statusEl.textContent = ''; }, 4000);
      }).catch(function () {
        statusEl.className = 'status-msg error';
        statusEl.textContent = 'Failed to update password. Try again.';
        setTimeout(function () { statusEl.textContent = ''; }, 4000);
      });
    });

    // Preferences
    document.getElementById("prefBtn").addEventListener("click", function () {
      UI.toast("Preferences applied");
    });

    // Reset data
    document.getElementById("resetBtn").addEventListener("click", function () {
      UI.openModal(
        "Reset Account Data?",
        "<p>This will reset your balance, tasks, and withdrawal history to the initial state. This action cannot be undone.</p>",
        {
          confirmText: "Reset",
          onConfirm: function () {
            DEMO.resetUser();
            UI.toast("Account data has been reset");
            setTimeout(function () { location.reload(); }, 800);
          }
        }
      );
    });

    // Logout
    document.getElementById("logoutBtn").addEventListener("click", function () {
      UI.logout();
    });
  </script>
</body>
</html>
