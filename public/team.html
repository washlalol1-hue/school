<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Team · T-Video Media</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div id="appRoot"></div>

  <template id="pageContent">
    <h1 class="page-title">My Team</h1>

    <div class="grid grid-4 mb-16">
      <div class="stat"><div class="label">Total members</div><div class="value" id="totalM">0</div></div>
      <div class="stat"><div class="label">Active</div><div class="value" id="activeM">0</div></div>
      <div class="stat"><div class="label">Inactive</div><div class="value" id="inactiveM">0</div></div>
      <div class="stat"><div class="label">Team earnings</div><div class="value" id="earnM">$0.00</div></div>
    </div>

    <div class="card mb-16">
      <h3 class="mt-0">Downline</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Username</th><th>Join date</th><th>VIP level</th><th>Contribution</th><th>Status</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </template>

  <script>if (!localStorage.getItem('tvmd_token')) { location.href = 'login.html'; }</script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    UI.renderShell("Team");

    API.fetch('/api/team').then(res => {
      if (!res.referrals) return;
      const referrals = res.referrals;
      const total = referrals.length;
      const active = referrals.filter(r => r.status === "Active").length;
      const inactive = total - active;
      const earnings = referrals.reduce((s, r) => s + (r.contribution || 0), 0);

      document.getElementById("totalM").textContent = total;
      document.getElementById("activeM").textContent = active;
      document.getElementById("inactiveM").textContent = inactive;
      document.getElementById("earnM").textContent = "$" + earnings.toFixed(2);

      const tbody = document.getElementById("rows");
      tbody.innerHTML = "";
      if (!referrals.length) {
        tbody.innerHTML = `<tr><td colspan="5" class="muted center">No team members yet</td></tr>`;
        return;
      }
      referrals.forEach(r => {
        const tr = document.createElement("tr");
        const cls = r.status === "Active" ? "badge-success" : "badge-muted";
        tr.innerHTML = `
          <td>${escapeHtml(r.username || '')}</td>
          <td>${escapeHtml(r.joined || '')}</td>
          <td><span class="badge badge-gold">VIP ${r.vip || 0}</span></td>
          <td>$${(r.contribution || 0).toFixed(2)}</td>
          <td><span class="badge ${cls}">${escapeHtml(r.status || '')}</span></td>
        `;
        tbody.appendChild(tr);
      });
    }).catch(() => {
      UI.toast("Failed to load team data");
    });
  </script>
</body>
</html>
