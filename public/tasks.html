<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video Tasks · T-Video Media</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    .lock-card { padding: 28px; text-align: center; }
    .lock-card .icon { font-size: 40px; margin-bottom: 10px; }
    .modal video { width: 100%; max-height: 280px; background: #000; border-radius: 10px; display: block; }
    .modal .video-fallback {
      width: 100%; aspect-ratio: 16/9; background: linear-gradient(135deg,#0b1830,#1a2238);
      display: grid; place-items: center; color: var(--primary); font-size: 36px; border-radius: 10px;
    }
    .reward-pill {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(0,224,255,.1); color: var(--primary);
      border: 1px solid rgba(0,224,255,.25);
      padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="appRoot"></div>

  <template id="pageContent">
    <h1 class="page-title">Video Tasks</h1>

    <!-- Status strip -->
    <div class="grid grid-4 mb-16" id="statStrip">
      <div class="stat"><div class="label">Active package</div><div class="value" id="sPkg">--</div></div>
      <div class="stat"><div class="label">Tasks today</div><div class="value" id="sToday">0 / 0</div></div>
      <div class="stat"><div class="label">Reward per task</div><div class="value" id="sReward">$0.00</div></div>
      <div class="stat"><div class="label">Today's earnings</div><div class="value" id="sEarn">$0.00</div></div>
    </div>

    <!-- Locked state -->
    <div id="locked" class="card lock-card hidden">
      <div class="icon">🔒</div>
      <h2 class="mt-0">No package selected</h2>
      <p class="muted">
        Buy a package to unlock daily video tasks. Each package decides
        how many tasks you get per day and how much each one pays.
      </p>
      <div class="row-flex" style="justify-content:center;">
        <a class="btn btn-primary" href="vip.html">Buy a package</a>
      </div>
    </div>

    <!-- Task list -->
    <div id="active" class="hidden">
      <div class="grid grid-3" id="taskGrid"></div>
    </div>
  </template>

  <script>if (!localStorage.getItem('tvmd_token')) { location.href = 'login.html'; }</script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    UI.renderShell("Video Tasks");

    var grid    = document.getElementById("taskGrid");
    var lockEl  = document.getElementById("locked");
    var aliveEl = document.getElementById("active");

    function loadTasks() {
      API.fetch('/api/tasks').then(function (res) {
        if (res.error) {
          UI.toast(res.error);
          return;
        }
        renderTasks(res.tasks || [], res.vipLevel);
      }).catch(function () {
        UI.toast('Failed to load tasks');
      });
    }

    function renderTasks(tasks, vipLevel) {
      var vip = DEMO.vipTiers.find(function (t) { return t.level === vipLevel; });
      var rewardPerTask = vip && vip.daily ? Math.round((vip.dailyIncome / vip.daily) * 100) / 100 : 0;

      // Top stats
      document.getElementById("sPkg").textContent = vip ? vip.name : "None";
      document.getElementById("sReward").textContent = "$" + rewardPerTask.toFixed(2);

      var done = tasks.filter(function (t) { return t.completed; }).length;
      var todayEarnings = done * rewardPerTask;
      document.getElementById("sToday").textContent = done + " / " + tasks.length;
      document.getElementById("sEarn").textContent = "$" + todayEarnings.toFixed(2);

      if (!vipLevel || tasks.length === 0) {
        lockEl.classList.remove("hidden");
        aliveEl.classList.add("hidden");
        return;
      }

      lockEl.classList.add("hidden");
      aliveEl.classList.remove("hidden");

      grid.innerHTML = "";
      tasks.forEach(function (t) {
        var card = document.createElement("div");
        card.className = "card video-card";
        var badge = t.completed
          ? '<span class="badge badge-muted">Completed</span>'
          : '<span class="badge badge-success">Available</span>';
        card.innerHTML =
          '<div class="video-thumb">\u25B6</div>' +
          '<div class="video-meta">' +
            '<h4>' + escapeHtml(t.title) + '</h4>' +
            '<div class="row-flex space-between">' +
              '<span class="reward-pill">+$' + (t.reward || rewardPerTask).toFixed(2) + '</span>' +
              badge +
            '</div>' +
            '<div class="row-flex mt-8">' +
              '<button class="btn btn-primary btn-sm watch-btn"' +
                ' data-id="' + escapeHtml(t.id) + '" data-src="' + escapeHtml(t.videoSrc || '') + '" data-reward="' + (t.reward || rewardPerTask) + '"' +
                (t.completed ? ' disabled style="opacity:.6;cursor:not-allowed;"' : '') + '>' +
                (t.completed ? "Done for today" : "Watch & Earn") +
              '</button>' +
            '</div>' +
          '</div>';
        grid.appendChild(card);
      });

      grid.querySelectorAll(".watch-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          openWatch(btn.dataset.id, btn.dataset.src, parseFloat(btn.dataset.reward));
        });
      });
    }

    function openWatch(id, src, reward) {
      var fallbackId   = "fbCountdown_" + id;
      var fallbackBar  = "fbBar_" + id;
      var videoElId    = "vid_" + id;

      var html =
        '<video id="' + videoElId + '" controls playsinline preload="metadata">' +
          '<source src="' + src + '" type="video/mp4" />' +
          '<source src="' + src.replace(/\.mp4$/, ".webm") + '" type="video/webm" />' +
        '</video>' +
        '<div id="note_' + id + '" class="muted mt-8" style="font-size:13px;">' +
          'Watch the video to the end to enable the Complete Task button.' +
        '</div>' +
        '<div id="fb_' + id + '" class="hidden">' +
          '<div class="video-fallback">\u25B6</div>' +
          '<div class="muted mt-8" style="font-size:13px;">Video not available. Using a 5-second countdown instead.</div>' +
          '<div class="mt-8" style="font-weight:700;">Countdown: <span id="' + fallbackId + '">5</span>s</div>' +
          '<div class="progress mt-8"><span id="' + fallbackBar + '" style="width:0%;"></span></div>' +
        '</div>' +
        '<div class="notice mt-16" style="margin-bottom:0;">Reward on completion: <strong>+$' + reward.toFixed(2) + '</strong></div>';

      UI.openModal("Daily task - " + id, html, {
        confirmText: "Complete Task",
        onConfirm: function () { onComplete(id, reward); },
      });

      var confirmBtn = document.getElementById("modalConfirm");
      confirmBtn.disabled = true;
      confirmBtn.style.opacity = .5;
      var enable = function () {
        confirmBtn.disabled = false;
        confirmBtn.style.opacity = 1;
      };

      var v = document.getElementById(videoElId);
      var usedFallback = false;
      var useFallback = function () {
        if (usedFallback) return;
        usedFallback = true;
        v.style.display = "none";
        var fb = document.getElementById("fb_" + id);
        fb.classList.remove("hidden");
        var s = 5;
        var total = 5;
        var tick = setInterval(function () {
          s--;
          var pct = Math.round(((total - s) / total) * 100);
          var cd = document.getElementById(fallbackId);
          var bar = document.getElementById(fallbackBar);
          if (cd)  cd.textContent = Math.max(0, s);
          if (bar) bar.style.width = pct + "%";
          if (s <= 0) { clearInterval(tick); enable(); }
        }, 1000);
      };

      v.addEventListener("ended", enable);
      v.addEventListener("timeupdate", function () {
        if (v.duration && v.currentTime / v.duration >= 0.9) enable();
      });

      v.addEventListener("error", useFallback, true);
      v.querySelectorAll("source").forEach(function (s) {
        s.addEventListener("error", function () {
          setTimeout(function () { if (v.networkState === 3 || v.error) useFallback(); }, 50);
        });
      });
      setTimeout(function () {
        if (v.readyState === 0) useFallback();
      }, 1500);
    }

    function onComplete(id, reward) {
      API.fetch('/api/tasks/' + encodeURIComponent(id) + '/complete', { method: 'POST' }).then(function (res) {
        if (res.error) {
          if (res.code === 'VIP_EXPIRED') {
            UI.openModal('VIP Expired', '<p>Your VIP package has expired. Please renew to continue earning.</p><a class="btn btn-primary" href="vip.html">Renew VIP</a>', { confirmText: 'OK' });
          } else {
            UI.toast(res.error);
          }
          return;
        }
        UI.toast('+$' + (res.reward || reward).toFixed(2) + ' earned!');
        loadTasks();
      }).catch(function () {
        UI.toast('Failed to complete task');
      });
    }

    loadTasks();
  </script>
</body>
</html>
