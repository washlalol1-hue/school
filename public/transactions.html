<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Transaction History · T-Video Media</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div id="appRoot"></div>

  <template id="pageContent">
    <h1 class="page-title">Transaction History</h1>

    <div class="tabs" id="tabs">
      <button class="tab active" data-filter="All">All</button>
      <button class="tab" data-filter="Task Reward">Task Rewards</button>
      <button class="tab" data-filter="VIP Upgrade">VIP Upgrades</button>
      <button class="tab" data-filter="Recharge">Recharge</button>
      <button class="tab" data-filter="Withdraw">Withdrawals</button>
      <button class="tab" data-filter="Referral">Referral Rewards</button>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th><th>Type</th><th>Amount</th><th>Status</th><th>Description</th>
            </tr>
          </thead>
          <tbody id="txRows"></tbody>
        </table>
      </div>
      <div class="row-flex space-between mt-16" id="pagination" style="display:none;">
        <button class="btn btn-sm" id="prevBtn" disabled>Previous</button>
        <span class="muted" id="pageInfo">Page 1 of 1</span>
        <button class="btn btn-sm" id="nextBtn" disabled>Next</button>
      </div>
    </div>
  </template>

  <script>if (!localStorage.getItem('tvmd_token')) { location.href = 'login.html'; }</script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    UI.renderShell("Transaction History");

    let currentFilter = "All";
    let currentPage = 1;
    let totalPages = 1;

    function statusBadge(s) {
      const map = {
        Completed: "badge-success",
        Pending:   "badge-warning",
        Rejected:  "badge-danger",
        Frozen:    "badge-danger",
      };
      return `<span class="badge ${map[s] || "badge-muted"}">${escapeHtml(s)}</span>`;
    }

    function loadTransactions(filter, page) {
      currentFilter = filter;
      currentPage = page;
      const tbody = document.getElementById("txRows");
      tbody.innerHTML = `<tr><td colspan="5" class="muted center">Loading...</td></tr>`;

      let url = '/api/transactions?page=' + page + '&limit=20';
      if (filter && filter !== 'All') {
        url += '&type=' + encodeURIComponent(filter);
      }

      API.fetch(url).then(res => {
        tbody.innerHTML = "";
        if (res.transactions && res.transactions.length) {
          totalPages = res.totalPages || 1;
          res.transactions.forEach(t => {
            const tr = document.createElement("tr");
            const sign = t.amount >= 0 ? "+" : "-";
            const cls = t.amount >= 0 ? "badge-success" : "badge-warning";
            tr.innerHTML = `
              <td>${escapeHtml(t.date || '')}</td>
              <td>${escapeHtml(t.type || '')}</td>
              <td><span class="badge ${cls}">${sign}$${Math.abs(t.amount).toFixed(2)}</span></td>
              <td>${statusBadge(t.status)}</td>
              <td class="muted">${escapeHtml(t.desc || '')}</td>
            `;
            tbody.appendChild(tr);
          });
        } else {
          totalPages = 1;
          tbody.innerHTML = `<tr><td colspan="5" class="muted center">No transactions found</td></tr>`;
        }
        updatePagination();
      }).catch(() => {
        tbody.innerHTML = `<tr><td colspan="5" class="muted center">Failed to load transactions</td></tr>`;
      });
    }

    function updatePagination() {
      const pag = document.getElementById("pagination");
      if (totalPages <= 1) {
        pag.style.display = "none";
        return;
      }
      pag.style.display = "";
      document.getElementById("pageInfo").textContent = "Page " + currentPage + " of " + totalPages;
      document.getElementById("prevBtn").disabled = currentPage <= 1;
      document.getElementById("nextBtn").disabled = currentPage >= totalPages;
    }

    document.getElementById("prevBtn").addEventListener("click", () => {
      if (currentPage > 1) loadTransactions(currentFilter, currentPage - 1);
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      if (currentPage < totalPages) loadTransactions(currentFilter, currentPage + 1);
    });

    document.querySelectorAll(".tab").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        loadTransactions(btn.dataset.filter, 1);
      });
    });

    loadTransactions("All", 1);
  </script>
</body>
</html>
