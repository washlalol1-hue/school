<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Invite · T-Video Media</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div id="appRoot"></div>

  <template id="pageContent">
    <h1 class="page-title">Invite Friends</h1>

    <div class="grid grid-2 mb-16">
      <div class="card">
        <div class="muted" style="font-size:12px;text-transform:uppercase;letter-spacing:.06em;">Your invitation code</div>
        <div style="font-size:24px;font-weight:800;color:var(--primary);" id="codeText">Loading...</div>
        <div class="row-flex mt-8">
          <button class="btn" id="copyCodeBtn">Copy code</button>
        </div>
      </div>
      <div class="card">
        <div class="muted" style="font-size:12px;text-transform:uppercase;letter-spacing:.06em;">Referral link</div>
        <div style="word-break:break-all;font-family:ui-monospace,monospace;font-size:14px;" id="linkText">
          Loading...
        </div>
        <div class="row-flex mt-8">
          <button class="btn btn-primary" id="copyLinkBtn">Copy link</button>
        </div>
      </div>
    </div>

    <div class="grid grid-4 mb-16">
      <div class="stat"><div class="label">Total team</div><div class="value" id="teamTotal">0</div></div>
      <div class="stat"><div class="label">Active</div><div class="value" id="teamActive">0</div></div>
      <div class="stat"><div class="label">L1 commission</div><div class="value">10%</div></div>
      <div class="stat"><div class="label">Team earnings</div><div class="value" id="teamEarn">$0.00</div></div>
    </div>

    <div class="grid grid-3 mb-16">
      <div class="card">
        <h3 class="mt-0">Level 1</h3>
        <div class="muted">Direct invites</div>
        <div style="font-size:22px;font-weight:800;color:var(--primary);">10%</div>
        <div class="muted" style="font-size:13px;">of task earnings</div>
      </div>
      <div class="card">
        <h3 class="mt-0">Level 2</h3>
        <div class="muted">Invites of your invites</div>
        <div style="font-size:22px;font-weight:800;color:var(--primary);">5%</div>
        <div class="muted" style="font-size:13px;">commission</div>
      </div>
      <div class="card">
        <h3 class="mt-0">Level 3</h3>
        <div class="muted">Third-tier downline</div>
        <div style="font-size:22px;font-weight:800;color:var(--primary);">2%</div>
        <div class="muted" style="font-size:13px;">commission</div>
      </div>
    </div>

    <div class="card">
      <h3 class="mt-0">Referral list</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Username</th><th>Level</th><th>Joined</th><th>VIP</th><th>Earnings</th><th>Status</th></tr>
          </thead>
          <tbody id="refRows"></tbody>
        </table>
      </div>
    </div>
  </template>

  <script>if (!localStorage.getItem('tvmd_token')) { location.href = 'login.html'; }</script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    UI.renderShell("Invite");

    let inviteCode = '';
    let inviteLink = '';

    // Load invite code/link from API
    API.fetch('/api/invite').then(res => {
      if (res.inviteCode) {
        inviteCode = res.inviteCode;
        inviteLink = window.location.origin + '/register.html?ref=' + encodeURIComponent(inviteCode);
        document.getElementById("codeText").textContent = inviteCode;
        document.getElementById("linkText").textContent = inviteLink;
      }
    }).catch(() => {
      document.getElementById("codeText").textContent = "Failed to load";
      document.getElementById("linkText").textContent = "Failed to load";
    });

    function copy(text) {
      try {
        navigator.clipboard.writeText(text);
        UI.toast("Copied to clipboard!");
      } catch {
        UI.toast("Copy not supported in this browser");
      }
    }
    document.getElementById("copyCodeBtn").addEventListener("click", () => copy(inviteCode));
    document.getElementById("copyLinkBtn").addEventListener("click", () => copy(inviteLink));

    // Load team data from API
    API.fetch('/api/team').then(res => {
      if (!res.referrals) return;
      const referrals = res.referrals;
      const total = referrals.length;
      const active = referrals.filter(r => r.status === "Active").length;
      const totalComm = res.totalCommission || 0;

      document.getElementById("teamTotal").textContent = total;
      document.getElementById("teamActive").textContent = active;
      document.getElementById("teamEarn").textContent = "$" + totalComm.toFixed(2);

      const tbody = document.getElementById("refRows");
      tbody.innerHTML = "";
      if (!referrals.length) {
        tbody.innerHTML = `<tr><td colspan="6" class="muted center">No referrals yet. Share your link to start earning!</td></tr>`;
        return;
      }
      referrals.forEach(r => {
        const tr = document.createElement("tr");
        const cls = r.status === "Active" ? "badge-success" : "badge-muted";
        const lvlCls = r.level === 1 ? "badge-gold" : r.level === 2 ? "badge-warning" : "badge-muted";
        tr.innerHTML = `
          <td>${escapeHtml(r.username || '')}</td>
          <td><span class="badge ${lvlCls}">L${r.level}</span></td>
          <td>${escapeHtml(r.joined || '')}</td>
          <td><span class="badge badge-gold">VIP ${r.vip || 0}</span></td>
          <td>$${(r.contribution || 0).toFixed(2)}</td>
          <td><span class="badge ${cls}">${escapeHtml(r.status || '')}</span></td>
        `;
        tbody.appendChild(tr);
      });
    }).catch(() => {});
  </script>
</body>
</html>
